services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PROFILE_POLICY_ID: ${NEXT_PUBLIC_PROFILE_POLICY_ID}
        NEXT_PUBLIC_NETWORK_ID: ${NEXT_PUBLIC_NETWORK_ID:-1}
        API_USER: ${API_USER}
        API_PASS: ${API_PASS}
        API_BASE_URL: ${API_BASE_URL}
    container_name: bjj-dapp-web
    environment:
      # Runtime API configuration (server-side only)
      - API_BASE_URL=${API_BASE_URL:-${NEXT_PUBLIC_API_URL}}
      # Legacy support for NEXT_PUBLIC_API_URL
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_PROFILE_POLICY_ID=${NEXT_PUBLIC_PROFILE_POLICY_ID}
      - NEXT_PUBLIC_NETWORK_ID=${NEXT_PUBLIC_NETWORK_ID:-1}
      # Server-side API credentials (not exposed to client)
      - API_USER=${API_USER}
      - API_PASS=${API_PASS}
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite DB and uploads
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped


